[project]
name = "cross-repo-porter"
version = "1.0.0"
description = "Cherry-pick commits across Git repositories with different directory structures using configurable path transformation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "GitPython==3.1.46",
    "gitdb==4.0.12",
    "requests==2.32.5",
    "urllib3==2.6.3"
]
authors = [
    {name = "Kavin Raj A M", email = "kavinrajam@github.com"},
    {name = "Saiprasanna Boyina", email = "saiprasanna-16@github.com"},
    {name = "Vikranth Nagaraj", email = "vikranthnagaraj@github.com"}
]

[project.scripts]
porter = "main:main"

[project.urls]
Repository = "https://github.com/kavinrajam/cross_repo_porter"
Documentation = "https://github.com/kavinrajam/cross_repo_porter/blob/main/README.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "cherry_picker",
    "config",
    "constants",
    "main",
    "path_transformer",
    "repository",
    "state",
]
